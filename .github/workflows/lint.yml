name: Lint

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # mint OIDC token for Workload Identity Federation

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to 3.12: docformatter 1.7.8 crashes on all Python 3.13.x
          # (tokenize.untokenize regression; upstream fix not yet released as of 2026-07-19).
          # Restore "3.13" once docformatter 1.7.9 ships with the fix (PyCQA/docformatter#360).
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.READER_SA }}
          token_format: access_token

      - name: Configure Poetry auth for Artifact Registry
        run: poetry config http-basic.cumplo-pypi oauth2accesstoken "${{ steps.auth.outputs.access_token }}"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: make lint
