[tool.poetry]
name = "cumplo-spotter"
version = "1.6.2"
description = "A simple yet powerful API for spotting secure and high-return Cumplo investment opportunities"
authors = ["Cristobal Sfeir <hello@cristobalsfeir.com>"]
packages = [{ include = "cumplo_spotter" }]

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.28.1"
arrow = "^1.2.3"
pydantic = "^2.1.1"
fastapi = "^0.109.1"
uvicorn = "^0.23.1"
gunicorn = "^21.2.0"
python-dotenv = "^1.0.0"
bs4 = "^0.0.1"
retry = "^0.9.2"
lxml = "^5.0"
google-cloud-logging = "^3.5.0"
httpx = "^0.26.0"
cumplo-common = { version = "^1.12.7", source = "cumplo-pypi" }
cachetools = "^5.5.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
basedpyright = ">=1.0"
docformatter = "^1.7.5"

[[tool.poetry.source]]
name = "cumplo-pypi"
url = "https://us-central1-python.pkg.dev/cumplo-scraper/cumplo-pypi/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingModuleSource = false

[tool.ruff]
line-length = 120
target-version = "py313"
preview = true
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "any-type",                              # allow typing.Any
  "undocumented-public-init",                                # no docstring required in __init__
  "multi-line-summary-first-line", "incorrect-blank-line-before-class",                        # docstring-layout style choices
  "undocumented-public-package",                                # no docstring required in public package
  "logging-f-string",                                # allow f-strings in logging
  "request-without-timeout",                                # allow requests without explicit timeout
  "docstring-missing-returns", "docstring-missing-exception", "docstring-missing-yields",          # don't force return/raise/yield docs
  "missing-trailing-comma", "single-line-implicit-string-concatenation",                    # defer to the formatter (avoid conflicts)
  "missing-copyright-notice",                              # no copyright header
  "raise-vanilla-args", "try-consider-else", "raise-within-try",          # relaxed exception-message/flow rules
  "raw-string-in-exception", "f-string-in-exception",                      # allow literals / f-strings in exceptions
  "mutable-class-default",                              # class vars without ClassVar
  "assert",                                # allow assert
  "blind-except",                              # allow broad except Exception
  "runtime-cast-value",                               # cast without quotes
  "raise-without-from-inside-except",                                # raise without from
  "collection-literal-concatenation",                              # allow list concat
  "missing-todo-author", "missing-todo-link", "line-contains-todo", "line-contains-hack",  # allow TODO/HACK comments
  "implicit-return",                              # allow implicit None return
  "commented-out-code",                              # allow commented-out code
  "assignment-in-assert",                              # assert on walrus
  "blanket-type-ignore",                              # allow blanket pyright ignores
  "bad-dunder-method-name",                             # dunder method naming
  "private-member-access",                              # access to private attributes
  "fast-api-non-annotated-dependency",                             # FastAPI dependency without Annotated (we are FastAPI)
  "function-call-in-default-argument",                                # function call in defaults, e.g. Depends(...) (FastAPI)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import"]
"tests/**" = ["missing-return-type-undocumented-public-function", "missing-type-function-argument", "missing-return-type-private-function", "undocumented-public-module", "import-outside-top-level", "import-private-name", "unused-function-argument"]
"tests/**/*_test.py" = ["undocumented-public-class", "undocumented-public-function", "undocumented-public-method", "missing-blank-line-after-summary", "boolean-type-hint-positional-argument", "magic-value-comparison", "no-self-use", "pytest-fixture-param-without-value", "unused-async"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120

[tool.docformatter]
pre-summary-newline = true
wrap-descriptions = 120
wrap-summaries = 120
recursive = true
blank = true
exclude = [".venv"]
